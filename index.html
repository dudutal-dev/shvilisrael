<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d33" />
    <meta name="description" content="שביל ישראל – אפליקציה לתכנון וביצוע המסע: מקטעים, לינה, מים, עונות, מפה, מצפן ו-GPS" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>שביל ישראל – מתכנן המסע</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b1d33;color:#e8eef7;font-family:Heebo,system-ui,sans-serif">
        <div style="display:flex;gap:4px"><span style="width:12px;height:38px;background:#fff;border-radius:3px"></span><span style="width:12px;height:38px;background:#2f80ed;border-radius:3px"></span><span style="width:12px;height:38px;background:#f2994a;border-radius:3px"></span></div>
        <div style="font-size:18px;font-weight:700">שביל ישראל</div>
        <div id="boot-msg" style="font-size:13px;opacity:.75">טוען… · Loading…</div>
      </div>
    </div>
    <script>
      // Boot guard: if the app has not mounted within 8s (e.g. a stale service worker after an update),
      // unregister the worker and drop only the app-shell precache – never user data (map tiles, photos) – then reload once.
      (function () {
        var KEY = 'shvil:boot-recover';
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot) return;
          var msg = document.getElementById('boot-msg');
          var tried = false; try { tried = !!sessionStorage.getItem(KEY); } catch (e) {}
          if (!tried) {
            try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
            if (msg) msg.textContent = 'מרענן… · Refreshing…';
            var reload = function () { location.reload(); };
            Promise.all([
              navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
              window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /precache/.test(k); }).map(function (k) { return caches.delete(k); })); }) : null
            ]).then(reload, reload);
          } else if (msg) {
            msg.innerHTML = 'האפליקציה לא נטענה · The app did not load<br><button onclick="try{sessionStorage.removeItem(\'shvil:boot-recover\')}catch(e){};location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:999px;border:0;background:#f2994a;color:#111;font-weight:700;font-size:15px">נסו שוב · Try again</button>';
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
