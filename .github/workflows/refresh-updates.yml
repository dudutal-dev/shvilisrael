# Daily: pull the latest route updates from SPNI, commit if changed, rebuild and publish to gh-pages.
name: Refresh trail updates
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: node scripts/fetch-spni-updates.mjs
      - id: commit
        run: |
          if [ -n "$(git status --porcelain public/data src/data/spni)" ]; then
            git config user.name "shvil-bot"
            git config user.email "actions@github.com"
            git add public/data src/data/spni
            git commit -m "chore: refresh SPNI trail updates ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'true'
        run: npm ci && npm run build
      - if: steps.commit.outputs.changed == 'true'
        name: Publish dist to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "shvil-bot"
          git config user.email "actions@github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy (updates refresh): $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
