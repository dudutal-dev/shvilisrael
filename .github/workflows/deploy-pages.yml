# Builds the app and publishes dist/ to the `gh-pages` branch.
# GitHub Pages setting: Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages / (root)
name: Build and publish to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Keep assets of recent deploys (devices with a cached app shell keep working)
        uses: actions/checkout@v4
        with: { ref: gh-pages, path: prev-pages }
        continue-on-error: true
      - run: node scripts/keep-old-assets.mjs prev-pages dist
      - name: Publish dist to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "shvil-bot"
          git config user.email "actions@github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(git -C .. rev-parse --short HEAD) $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
