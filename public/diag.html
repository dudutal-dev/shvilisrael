<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>שביל ישראל – אבחון</title>
<style>body{font-family:system-ui,sans-serif;padding:16px;background:#0b1d33;color:#e8eef7;line-height:1.5}pre{direction:ltr;text-align:left;white-space:pre-wrap;background:#122a47;padding:10px;border-radius:8px;font-size:12px}.ok{color:#7ee787}.bad{color:#ff7b72}h1{font-size:20px}</style></head>
<body><h1>אבחון טעינה · Load diagnostics</h1>
<p>צלמו את המסך הזה ושלחו · Please screenshot this page.</p>
<pre id="out">running…</pre>
<script>
(function(){
  var L=[]; function log(s){L.push(s); document.getElementById('out').textContent=L.join('\n');}
  log('time: '+new Date().toISOString());
  log('UA: '+navigator.userAgent);
  log('online: '+navigator.onLine+' · standalone: '+(window.navigator.standalone||matchMedia('(display-mode: standalone)').matches));
  log('serviceWorker: '+('serviceWorker' in navigator)+' · caches: '+('caches' in window)+' · indexedDB: '+('indexedDB' in window));
  try{ log('localStorage: ok ('+localStorage.length+' keys, lang='+localStorage.getItem('shvil:lang')+')'); }catch(e){ log('localStorage: BLOCKED '+e.message); }
  var tests={ 'optional chaining ?.':'({}).a?.b', 'nullish ??':'null ?? 1', 'logical assign ||=':'(function(){var q=0;q||=1;return q})()', 'class fields':'class A{x=1}', 'async/await':'(async()=>{})()', 'Promise.allSettled':'typeof Promise.allSettled', 'regex lookbehind':'/(?<=a)b/.test("ab")', 'BigInt':'1n', 'Array.at':'[1].at(-1)', 'structuredClone':'structuredClone({})', 'Intl he-IL date':'new Date().toLocaleDateString("he-IL",{weekday:"long"})', 'Intl en-GB date':'new Date().toLocaleDateString("en-GB",{weekday:"long"})' };
  for(var k in tests){ try{ new Function('return ('+tests[k]+')')(); log('✓ '+k); }catch(e){ log('✗ '+k+': '+e.message); } }
  try{ var m=document.createElement('script'); log('module scripts: '+('noModule' in m)); }catch(e){}
  var errs=[]; window.addEventListener('error',function(e){ log('ERROR: '+e.message+' @ '+String(e.filename||'').split('/').pop()+':'+e.lineno); });
  fetch('./index.html',{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
    var m=html.match(/assets\/index-[^"]+\.js/); var css=html.match(/assets\/index-[^"]+\.css/);
    log('index.html: '+html.length+' bytes · main script: '+(m&&m[0]));
    var urls=[m&&m[0], css&&css[0], 'sw.js', 'manifest.webmanifest', 'data/updates.json'].filter(Boolean);
    return Promise.all(urls.map(function(u){ return fetch('./'+u,{cache:'no-store'}).then(function(r){ log((r.ok?'✓ ':'✗ ')+u+' → '+r.status+' '+(r.headers.get('content-type')||'')); }).catch(function(e){ log('✗ '+u+' → '+e.message); }); }));
  }).then(function(){
    log('loading the app bundle as a module…');
    var s=document.createElement('script'); s.type='module';
    s.textContent="import('./assets/'+(document.body.dataset.main||'')).then(()=>window.__diagLog('✓ app bundle executed (module import ok)')).catch(e=>window.__diagLog(/#299|createRoot|Target container/.test(String(e&&e.message))?'✓ app bundle executed (parsed and ran up to React mount)':'✗ app bundle failed: '+(e&&e.message)))";
    fetch('./index.html',{cache:'no-store'}).then(function(r){return r.text()}).then(function(html){ var m=html.match(/assets\/(index-[^"]+\.js)/); document.body.dataset.main=m?m[1]:''; document.body.appendChild(s); });
  }).catch(function(e){ log('index.html fetch failed: '+e.message); });
  window.__diagLog=log;
  if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ log('SW registrations: '+rs.length+(rs[0]&&rs[0].active?' (active)':'')); });
  if(window.caches) caches.keys().then(function(ks){ log('caches: '+ks.join(', ')); });
})();
</script></body></html>
